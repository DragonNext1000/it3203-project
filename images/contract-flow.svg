<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="Flow: a user sends a transaction, nodes run the contract code, and the shared state updates">
  <rect width="640" height="200" fill="#f4f6f8"/>
  <g font-family="Arial, sans-serif" font-size="23" fill="#fff" text-anchor="middle">
    <rect x="15" y="50" width="170" height="100" rx="8" fill="#2f5d8a"/>
    <text x="100" y="92">User sends</text><text x="100" y="122">transaction</text>
    <rect x="235" y="50" width="170" height="100" rx="8" fill="#1f3a56"/>
    <text x="320" y="92">Nodes run</text><text x="320" y="122">the code</text>
    <rect x="455" y="50" width="170" height="100" rx="8" fill="#2f5d8a"/>
    <text x="540" y="92">Shared state</text><text x="540" y="122">updates</text>
  </g>
  <g stroke="#555" stroke-width="4"><line x1="188" y1="100" x2="222" y2="100"/><line x1="408" y1="100" x2="442" y2="100"/></g>
  <polygon points="220,90 220,110 236,100" fill="#555"/><polygon points="440,90 440,110 456,100" fill="#555"/>
</svg>
