<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="A bridge locks tokens on Chain A and mints a copy on Chain B; the locked funds held by the bridge are what attackers target">
  <rect width="640" height="220" fill="#f4f6f8"/>
  <g font-family="Arial, sans-serif" font-size="23" fill="#fff" text-anchor="middle">
    <rect x="15" y="40" width="170" height="100" rx="8" fill="#2f5d8a"/>
    <text x="100" y="82">Chain A</text><text x="100" y="112">tokens locked</text>
    <rect x="235" y="40" width="170" height="100" rx="8" fill="#b42318"/>
    <text x="320" y="82">Bridge</text><text x="320" y="112">holds the funds</text>
    <rect x="455" y="40" width="170" height="100" rx="8" fill="#2f5d8a"/>
    <text x="540" y="82">Chain B</text><text x="540" y="112">copy is minted</text>
  </g>
  <g stroke="#555" stroke-width="4"><line x1="188" y1="90" x2="222" y2="90"/><line x1="408" y1="90" x2="442" y2="90"/></g>
  <polygon points="220,80 220,100 236,90" fill="#555"/><polygon points="440,80 440,100 456,90" fill="#555"/>
  <text x="320" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#b42318" font-weight="bold">Attackers target the locked funds</text>
</svg>
