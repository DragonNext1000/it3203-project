<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Layer 2 rollups batch transactions and post them to a Layer 1 blockchain, which provides security back to Layer 2">
  <rect width="640" height="320" fill="#f4f6f8"/>
  <rect x="30" y="20" width="580" height="80" rx="8" fill="#2f5d8a"/>
  <text x="320" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#fff">Layer 2 rollups</text>
  <text x="320" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#fff">Arbitrum, Base, zkSync</text>
  <rect x="30" y="220" width="580" height="80" rx="8" fill="#1f3a56"/>
  <text x="320" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#fff">Layer 1: Ethereum</text>
  <text x="320" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#fff">settlement and security</text>
  <line x1="150" y1="102" x2="150" y2="206" stroke="#555" stroke-width="4"/>
