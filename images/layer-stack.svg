  <line x1="470" y1="218" x2="470" y2="114" stroke="#555" stroke-width="4"/>
  <polygon points="459,116 481,116 470,100" fill="#555"/>
  <text x="488" y="156" font-family="Arial, sans-serif" font-size="21" fill="#222">security</text>
  <text x="488" y="182" font-family="Arial, sans-serif" font-size="21" fill="#222">inherited</text>
</svg>
